[package]
name = "gpui-calendar"
version = "0.1.0"
description = "Day, week and month calendar views with a time grid, in GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "calendar", "scheduler", "time-grid", "gui"]
categories = ["gui", "date-and-time"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_calendar"

[dependencies]
# Pinned exactly: GPUI comes as GPUI Kit, which pins a snapshot of Zed's GPUI (gpui-pre 0.3.12).
gpui-kit = { workspace = true }
# Dates and times. chrono is the version GPUI Kit's own date picker already uses; chrono-tz
# carries the IANA database, so the display zone and its DST days don't depend on the machine's.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Only for the shots feature: the same GPUI with its test support (offscreen rendering) on, and
# GPUI's version of the image crate to save the picture.
gpui-pre = { workspace = true, features = ["test-support"], optional = true }
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Pictures of the example's window rendered offscreen (`--shot`).
shots = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "calendar"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

# The overflow test lays text out with Core Text and Inter, as on screen, rather than with the
# test platform's stand-in widths. runtime_shaders: no Metal toolchain needed to build; tests
# never draw with Metal.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { workspace = true, features = ["font-kit", "runtime_shaders"] }
