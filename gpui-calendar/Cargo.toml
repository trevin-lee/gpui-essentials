[package]
name = "gpui-calendar"
version = "0.1.0"
description = "Day, week, month, year and agenda calendar views with a time grid, in GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "calendar", "scheduler", "time-grid", "gui"]
categories = ["gui", "date-and-time"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_calendar"

[dependencies]
# GPUI under its own name, pinned exactly in the workspace (gpui-pre 0.3.12), and gpui-core for
# the theme the calendar takes its colours and font from and the header's buttons.
gpui = { workspace = true }
gpui-core = { path = "../gpui-core" }
# The drags: gpui-dnd runs a drag's life, the calendar works out what it proposes.
gpui-dnd = { path = "../gpui-dnd" }
# Dates and times. chrono-tz carries the IANA database, so the display zone and its DST days
# don't depend on the machine's.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Only for the shots feature: the macOS platform with its test support (offscreen rendering)
# on, and GPUI's version of the image crate to save the picture.
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# In a browser: GPUI's clock there (web-time's Instant, the version GPUI's own clock uses), and
# the current time from JavaScript's Date (chrono's wasmbind), since wasm32 has neither from std.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["wasmbind"] }

[features]
# Pictures of the example's window rendered offscreen (`--shot`).
shots = ["gpui/test-support", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "calendar"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The example's window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }

# The overflow test lays text out with Core Text and Inter, as on screen, rather than with the
# test platform's stand-in widths. runtime_shaders: no Metal toolchain needed to build; tests
# and the example compile their shaders when a window opens.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { workspace = true, features = ["font-kit", "runtime_shaders"] }
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
