[package]
name = "gpui-tables"
version = "0.1.0"
description = "Notion-style database views (table, board, list) for GPUI apps, with a model and engine that build without GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "database", "table", "kanban", "notion"]
categories = ["gui", "data-structures"]
include = ["/src", "/examples", "/tests/fixtures", "/README.md"]

[lib]
name = "gpui_tables"

[dependencies]
# The model and engine (gpui_tables::model, ::engine, ::order), which build without GPUI.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# New rows', properties', views' and options' ids: lowercase v4 UUIDs, made by the creator.
uuid = { version = "1", features = ["v4"] }
# Counting a doc icon's grapheme clusters (an emoji icon is one).
unicode-segmentation = "1.12"
# The views (the gpui feature): GPUI under its own name, pinned exactly in the workspace
# (gpui-pre 0.3.12), and gpui-core for the theme, Press and icons.
gpui = { workspace = true, optional = true }
gpui-core = { path = "../gpui-core", optional = true }
# The table's row drag: sources, a target, the preview, touch and Escape.
gpui-dnd = { path = "../gpui-dnd", optional = true }
# Days as gpui-core's month (MonthGrid) takes and gives them: the version gpui-core uses.
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
# Only for the shots feature: the macOS platform with its test support (offscreen rendering)
# on, and GPUI's version of the image crate to save the picture.
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The host's default clock in a browser, where wasm32's std::time panics: the version GPUI's
# own clock uses, so the lock doesn't grow.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[features]
default = ["gpui"]
# The GPUI views (tables, boards and lists). Without it (default-features = false) the crate
# is the model and engine alone, with no GPUI in the build.
gpui = ["dep:gpui", "dep:gpui-core", "dep:gpui-dnd", "dep:chrono"]
# GPUI's test support (a test window, simulated input), for running the view tests where the Mac's
# dev-dependencies don't switch it on: `cargo test -p gpui-tables --features
# test-support,gpui/bench-support` on Linux. The tests that lay text out with Core Text stay Mac-only.
test-support = ["gpui", "gpui/test-support", "gpui-core/test-support"]
# Pictures of the crm example's window rendered offscreen (`--shot`), for the README.
shots = ["gpui", "gpui/test-support", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "crm"
required-features = ["gpui"]

# GPUI's test support (a test window, simulated input) and the example's window are the Mac's,
# so the engine-only build and its tests on Linux never pull GPUI in.
[target.'cfg(target_os = "macos")'.dev-dependencies]
# bench-support: the overflow test reads the drawn scene.
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui-core = { path = "../gpui-core", features = ["test-support"] }
# The example's window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Shaders compiled when a window opens, so tests and the example build without Xcode's separate
# Metal Toolchain. Only here: what apps ship stays on precompiled shaders.
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
# The overflow test lays text out with Core Text, as on screen.
gpui-pre-apple = { workspace = true, features = ["font-kit", "runtime_shaders"] }
