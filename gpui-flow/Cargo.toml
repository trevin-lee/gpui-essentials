# The flow canvas: a node-and-edge editor in the manner of React Flow, as a
# library with an example window. Nodes are ordinary GPUI elements; edges, the background, the
# minimap and the controls are painted by the crate.
[package]
name = "gpui-flow"
version = "0.1.0"
description = "A node-based editor in the manner of React Flow, in GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "gpui_flow"


[dependencies]
# GPUI under its own name, pinned exactly in the workspace (gpui-pre 0.3.12), and gpui-core for
# the theme the flow takes its colours from.
gpui = { workspace = true }
gpui-core = { path = "../gpui-core" }
# Palette drops: a host's palette items are gpui-dnd sources and the pane is a target.
gpui-dnd = { path = "../gpui-dnd" }
# Nodes and edges save and load as JSON, and a node's data is any JSON value.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ink points are stored as base64, as a PencilKit stroke's payload carries them.
base64 = "0.22"
# A fast hash, seeded at random, for the maps every frame looks every node up in.
foldhash = "0.2"
# Only for the png feature: SVG drawn into pixels, for `export::svg_to_png`.
resvg = { version = "0.46", optional = true }
# Only for the shots feature: the macOS platform with its test support (offscreen rendering)
# on, and GPUI's version of the image crate to save the picture.
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# GPUI's Instant and the clock in a browser, where wasm32 has no std::time: the version GPUI's
# own clock uses, so the lock doesn't grow.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[features]
# PNG export (`export::svg_to_png`), through resvg.
png = ["dep:resvg"]
# Pictures of the example's window rendered offscreen (`--shot`), as the editor's.
shots = ["gpui/test-support", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "flow"

# How long a frame of a 5,000-node whiteboard takes: `cargo bench -p gpui-flow --bench scale`.
[[bench]]
name = "scale"
harness = false

[dev-dependencies]
# bench-support: the overflow test reads the drawn scene.
gpui = { workspace = true, features = ["test-support", "bench-support"] }
# The overflow test lays text out with Core Text, as on screen.
gpui-pre-apple = { workspace = true, features = ["font-kit"] }
# The example's window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Its shaders compiled when the window opens, so tests and the example build without Xcode's
# separate Metal Toolchain. Only here: what apps ship stays on precompiled shaders.
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
# The scale benchmark times frames in the thread's CPU time.
libc = "0.2"
