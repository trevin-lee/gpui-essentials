# The components `gpui-core add` copies into a host's crate, read by that CLI and checked
# against the source by tests/components_registry.rs (run `cargo test -p gpui-core --test
# components_registry` after changing a component's paths).
#
# A component reaches the rest of gpui-core only through `crate::base::…` (in a copy,
# `gpui_core::base::…`) and through the components in its `needs` (in a copy, `super::…`).
# For each:
#   file      its source, from this crate's directory
#   needs     the components it uses directly, which are copied with it
#   init      its function binding keys, which a host calls once it's copied; absent if none
#   contexts  its own key contexts, which the CLI renames (with a `Ui` prefix)
#   actions   its action namespace, which the CLI renames (to `ui`); absent if none

# The modules that stay in gpui-core, behind gpui_core::base.
base = ["a11y", "base", "chart", "highlight", "icon", "input", "menu", "modal", "picker", "popover", "press", "root", "size", "text", "theme"]

[accordion]
file = "src/accordion.rs"
needs = []
init = "init"
contexts = ["GpuiCoreAccordion"]
actions = "gpui_core_accordion"

[alert]
file = "src/alert.rs"
needs = []
contexts = []

