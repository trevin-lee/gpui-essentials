[package]
name = "gpui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Components for GPUI apps on macOS and iOS, drawn in the host's theme."
keywords = ["gpui", "ui", "components", "theme", "gui"]
categories = ["gui"]

[lib]
name = "gpui_core"

[dependencies]
# GPUI itself, under its own name, so its macros' `gpui::` paths resolve in this crate and in
# every crate using it. Pinned exactly in the workspace: one GPUI for everything that links it.
gpui = { workspace = true }
# Markdown (GitHub's flavour) for TextView: rustdoc's parser, fuzzed upstream (and here) never
# to panic, as the `markdown` crate did on some input (fatal where panics abort, as on iPhone).
pulldown-cmark = { version = "0.13.6", default-features = false }
# Grapheme and word boundaries for the caret, the arrow keys and double-clicks.
unicode-segmentation = "1.12"
# Dates for DatePicker: the version the workspace's calendar and cards use.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

# Only for the shots feature: the macOS platform with its test support (offscreen rendering)
# on, and GPUI's version of the image crate to save the picture.
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# Only for the highlight feature: tree-sitter and its grammars, at the versions GPUI Kit's
# component crate pins (known to build together).
tree-sitter = { version = "0.26.13", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-swift = { version = "0.7.0", optional = true }
tree-sitter-go = { version = "0.23.4", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.23.1", optional = true }
tree-sitter-python = { version = "0.23.6", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.1", optional = true }
tree-sitter-bash = { version = "0.23.3", optional = true }
tree-sitter-sequel = { version = "0.3.8", optional = true }
tree-sitter-md = { version = "0.5.1", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.23.2", optional = true }
tree-sitter-c = { version = "0.24.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }

[features]
# GPUI's test support (a headless window, simulated input), for hosts' tests.
test-support = ["gpui/test-support"]
# Pictures of the gallery example's window rendered offscreen (`--shot`).
shots = ["gpui/test-support", "dep:gpui-pre-macos", "dep:image"]
# Syntax highlighting (tree-sitter and its grammars): off by default, for the grammars' size.
highlight = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-go",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-md",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
]

[[example]]
name = "gallery"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The gallery's window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }

# The overflow test lays text out with Core Text, as on screen, and reads the drawn scene.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support", "bench-support"] }
# runtime_shaders: no Metal toolchain needed to build (Xcode 26 ships it separately); tests
# never draw with Metal.
gpui-pre-apple = { workspace = true, features = ["font-kit", "runtime_shaders"] }
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
