# The GPUI crates in one workspace, so they build and test against one GPUI.
[workspace]
resolver = "3"
members = ["gpui-agents", "gpui-blocks", "gpui-blocks/engine", "gpui-calendar", "gpui-core", "gpui-cli", "gpui-dnd", "gpui-flow", "gpui-tables", "third_party/katex-native"]

[workspace.package]
edition = "2024"
# The Rust the crates are built and tested with (rust-toolchain.toml).
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/trevin-lee/gpui-essentials"

# Pinned exactly, here only: a snapshot of Zed's GPUI (gpui-pre 0.3.12). Every crate takes
# these, so an app using several of them links one GPUI, and must use the same versions itself.
[workspace.dependencies]
gpui-pre = "=0.3.12"
gpui-pre-macos = "=0.3.12"
gpui-pre-apple = "=0.3.12"
# The same GPUI under its own name, for crates that use it directly (gpui-core): GPUI's macros
# write `gpui::` paths.
gpui = { package = "gpui-pre", version = "=0.3.12" }

# For this repository's own builds (the examples and their measurements). Cargo ignores a
# dependency's profiles, so apps using these crates build with their own.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
