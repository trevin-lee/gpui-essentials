# Drag and drop for GPUI in the manner of react-dnd: sources, targets, a monitor, a drag layer,
# and mouse, touch and keyboard backends, with sortable lists and auto-scroll on top.
[package]
name = "gpui-dnd"
version = "0.1.0"
description = "Drag and drop for GPUI in the manner of react-dnd"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gpui", "drag-and-drop", "dnd", "sortable", "ui"]
categories = ["gui"]
publish = false

[lib]
name = "gpui_dnd"

[dependencies]
# GPUI under its own name, pinned exactly in the workspace (gpui-pre 0.3.12), and gpui-core for
# the theme the previews and drop indicators take their colours from.
gpui = { workspace = true }
gpui-core = { path = "../gpui-core" }

# Only for the shots feature: the macOS platform with its test support (offscreen rendering)
# on, and GPUI's version of the image crate to save the picture.
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# GPUI's test support (a headless window, simulated input), for hosts' tests.
test-support = ["gpui/test-support"]
# Pictures of the examples' windows rendered offscreen (`--shot out.png --scene <name>`).
shots = ["gpui/test-support", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "kanban"

[[example]]
name = "sortable"

[[example]]
name = "nested"

[[example]]
name = "custom_preview"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The examples' window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Its shaders compiled when the window opens, so the examples build without Xcode's separate
# Metal Toolchain.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
