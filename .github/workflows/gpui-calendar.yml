name: gpui-calendar

# Runs when gpui-calendar, or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-calendar/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-calendar.yml"
  pull_request:
    paths:
      - "gpui-calendar/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-calendar.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-calendar-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-gpui-calendar-
      - run: cargo fmt -p gpui-calendar --check
      - run: cargo clippy -p gpui-calendar --locked --all-targets -- -D warnings
      - run: cargo clippy -p gpui-calendar --locked --all-targets --features shots -- -D warnings
      # Unit, interaction and headless tests, and the README's examples compiled.
      - run: cargo test -p gpui-calendar --locked
      - run: cargo doc -p gpui-calendar --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  ios:
    # The host apps on the iPhone and iPad are GPUI apps too, so the crate must build for iOS.
    # GPUI Kit leaves the platform to the app on iOS (the app links gpui-pre-ios itself), so this
    # builds and lints the library; the example and the tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-calendar-ios-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-gpui-calendar-ios-
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-calendar --locked --target aarch64-apple-ios-sim
      - run: cargo clippy -p gpui-calendar --locked --lib --target aarch64-apple-ios-sim -- -D warnings
