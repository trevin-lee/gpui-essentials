name: pages

# The documentation sites (docs-site/): the renderer linted, every component drawn light and
# dark, and the crates' API docs beside it as /api, for GitHub Pages; and the Next.js site
# (docs-site/web) with the live previews, for Vercel. On main (on a push to docs-site/, nightly,
# or by hand) both are published; a pull request uploads the Pages site as an artifact and
# deploys a Vercel preview.
on:
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit's site matters.
  cancel-in-progress: true

jobs:
  # The live page's app (docs-site/live), built for the browser: wasm32, wasm-bindgen's glue
  # and wasm-opt. Linux, since it draws nothing here.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs-site-live
          workspaces: docs-site/live
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen's CLI at the version docs-site/live/Cargo.toml pins, and binaryen's
      # wasm-opt: their release builds, checked against their published checksums.
      - name: Tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          wb=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          curl -sSfLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$wb.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $wb.tar.gz" | sha256sum -c -
          tar xzf "$wb.tar.gz"
          by=binaryen-version_133-x86_64-linux
          curl -sSfLO "https://github.com/WebAssembly/binaryen/releases/download/version_133/$by.tar.gz"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $by.tar.gz" | sha256sum -c -
          tar xzf "$by.tar.gz"
          echo "$RUNNER_TEMP/tools/$wb" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/binaryen-version_133/bin" >> "$GITHUB_PATH"
      # rust-toolchain.toml pins the version; this adds its wasm32 target.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --manifest-path docs-site/live/Cargo.toml --check
      - run: cargo clippy --manifest-path docs-site/live/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - run: docs-site/live/build.sh "$RUNNER_TEMP/live"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live
          path: ${{ runner.temp }}/live
          retention-days: 1

  render:
    needs: live
    # The pictures are GPUI's offscreen rendering, which needs macOS (Metal).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use. The renderer is
      # its own workspace, cached beside the crates' (for the API docs). Only main saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs-site
          workspaces: |
            docs-site/render
            .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path docs-site/render/Cargo.toml --check
      # The demos that are views are whole items, so rustfmt checks them too (the others are
      # bare expressions, which it can't parse).
      - run: rustfmt --edition 2024 --check $(grep -l 'pub struct Example' docs-site/demos/*/*.rs)
      - run: cargo clippy --manifest-path docs-site/render/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo run --manifest-path docs-site/render/Cargo.toml --locked -- --out "$RUNNER_TEMP/site"
      # The Next.js site's content: the registry as JSON, and the pictures just drawn.
      - name: The Next.js site's content
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          cargo run --manifest-path docs-site/render/Cargo.toml --locked -- --json "$RUNNER_TEMP/web/registry.json"
          cp -R "$RUNNER_TEMP/site/img" "$RUNNER_TEMP/web/img"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-content
          path: ${{ runner.temp }}/web
          retention-days: 1
      # The live page's app, beside live.html.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live
          path: ${{ runner.temp }}/site/live
      # Every crate's rustdoc, which the pages' "Docs" links lead to. A pull request's checks
      # already build each crate's docs, so only the published site builds them here.
      - name: API docs
        if: github.event_name != 'pull_request'
        run: |
          cargo doc --workspace --no-deps --locked
          cp -R target/doc "$RUNNER_TEMP/site/api"
        env:
          RUSTDOCFLAGS: -D warnings
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # The Next.js site: built from the registry, the pictures and the live bundle, and deployed to
  # Vercel as it is (`vercel deploy --prebuilt`): a preview for a pull request, production on
  # main. Needs the repository's secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID;
  # without them (a fork's pull request) it builds and stops there.
  web:
    needs: render
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Whether there's a token, without handing it to every step (npm's packages run here).
      DEPLOYS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
      VERCEL_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: docs-site/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-content
          path: ${{ runner.temp }}/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live
          path: docs-site/web/public/live
      - name: Content
        run: |
          mkdir -p data
          mv "$RUNNER_TEMP/web/registry.json" data/registry.json
          mv "$RUNNER_TEMP/web/img" public/img
      - run: npm ci
      - run: npm run build
      - run: scripts/vercel-output.sh
      - name: Deploy
        if: env.DEPLOYS == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          prod=
          if [ "$PROD" = true ]; then prod=--prod; fi
          url=$(npx --yes vercel@58.1.0 deploy --prebuilt $prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"

  # Publishes main's site. Pages must be on, with GitHub Actions as its source (Settings,
  # Pages).
  deploy:
    needs: render
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
