name: gpui-blocks

# Runs when gpui-blocks, or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-blocks/**"
      # The engine draws with gpui-core's paragraph layer.
      - "gpui-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-blocks.yml"
  # A gpui-core change alone doesn't run the macOS job (changes.py's --not gpui-core):
  # gpui-core's own workflow lints every crate and builds its tests then, and main's nightly run
  # tests them all. Another crate this one depends on by path (gpui-dnd, say) does run it.
  pull_request:
    paths:
      - "gpui-blocks/**"
      # The crates it depends on by path change it too (.github/scripts/changes.py decides).
      - "gpui-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-blocks.yml"

  # Every change was built and tested on its pull request, so a push to main runs only the
  # Linux jobs: GitHub runs 5 macOS jobs at once, and each push to main queued macOS and iOS
  # jobs in every crate. Main gets the full macOS and iOS run once a night instead (which is
  # also when the caches pull requests restore are saved), or by hand.
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      shots:
        description: "Scenes to render (e.g. callouts callouts-light); empty runs the checks"
        required: false
        default: ""

permissions:
  contents: read
  # The changes job lists a pull request's files.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only the newest commit's result matters, on main as on a pull request.
  cancel-in-progress: true

jobs:
  # What a pull request changed, for this crate (.github/scripts/changes.py). `own`: the crate's
  # files or this workflow; the slow jobs (the iOS build, the shots lint) run on main nightly,
  # and on a pull request only then. `run`: anything the crate builds from (`own`, the toolchain, a
  # workspace crate it depends on by path, the root Cargo.toml past its members line, or a
  # Cargo.lock package in its dependency tree); the macOS job runs only then, so adding a crate to
  # the workspace or bumping another crate's dependency doesn't run every crate's macOS job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      own: ${{ steps.diff.outputs.own }}
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then printf 'own=true\nrun=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changes.py '^(gpui\-blocks/|\.github/workflows/gpui\-blocks\.yml)' gpui-blocks gpui-blocks-engine --not gpui-core >> "$GITHUB_OUTPUT"

  macos:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.run == 'true' && inputs.shots == ''
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-blocks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p gpui-blocks -p gpui-blocks-engine --check
      - run: cargo clippy -p gpui-blocks --locked --all-targets -- -D warnings
      # The engine gpui-blocks is built on (engine/), with its own tests and examples.
      - run: cargo clippy -p gpui-blocks-engine --locked --all-targets -- -D warnings
      - if: needs.changes.outputs.own == 'true'
        run: cargo clippy -p gpui-blocks --locked --all-targets --features shots -- -D warnings
      # Unit, interaction and headless tests, and the README's examples compiled.
      - run: cargo test -p gpui-blocks --locked
      - run: cargo test -p gpui-blocks-engine --locked --all-targets
      - run: cargo doc -p gpui-blocks -p gpui-blocks-engine --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    if: inputs.shots == ''
    # gpui-blocks must build for the browser too, as gpui-core and gpui-calendar do: an app can
    # run it as wasm on GPUI's web platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-blocks-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, which rustup installs here first.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p gpui-blocks -p gpui-blocks-engine --locked --target wasm32-unknown-unknown

  ios:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.own == 'true' && inputs.shots == ''
    # Hosts on iPhone and iPad run the editor through GPUI's iOS backend, so it must build for iOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-blocks-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-blocks --locked --target aarch64-apple-ios-sim

  shots:
    if: inputs.shots != ''
    # The example's pictures (`--shot`, one per scene): offscreen drawing needs GPUI's macOS
    # backend. Uploaded as an artifact to download and look at.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-blocks-shots
          save-if: false
      - env:
          SCENES: ${{ inputs.shots }}
        run: |
          mkdir shots
          for scene in $SCENES; do
            cargo run --release -p gpui-blocks --locked --features shots --example editor -- --shot "shots/$scene.png" --scene "$scene"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpui-blocks-shots
          path: shots/
