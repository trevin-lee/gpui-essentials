name: gpui-core

# Runs when gpui-core, or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-core.yml"
  pull_request:
    paths:
      - "gpui-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-core.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-gpui-core-
      - run: cargo fmt -p gpui-core --check
      - run: cargo clippy -p gpui-core --locked --all-targets -- -D warnings
      - run: cargo clippy -p gpui-core --locked --all-targets --features shots -- -D warnings
      # Unit, interaction and headless tests, and the README's examples compiled.
      - run: cargo test -p gpui-core --locked
      - run: cargo doc -p gpui-core --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  ios:
    # The crate must build for iOS too (the shared editors may run in the iPhone and iPad apps).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-core-ios-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-gpui-core-ios-
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-core --locked --target aarch64-apple-ios-sim
