name: gpui-core

# Runs when gpui-core or its CLI, or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-core/**"
      - "gpui-cli/**"
      # The vendored katex-native and its fonts, which the math feature draws with.
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-core.yml"
  pull_request:
    paths:
      - "gpui-core/**"
      - "gpui-cli/**"
      # The vendored katex-native and its fonts, which the math feature draws with.
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-core.yml"

  # Every change was built and tested on its pull request, so a push to main runs only the
  # Linux jobs: GitHub runs 5 macOS jobs at once, and each push to main queued macOS and iOS
  # jobs in every crate. Main gets the full macOS and iOS run once a night instead (which is
  # also when the caches pull requests restore are saved), or by hand.
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The changes job lists a pull request's files.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only the newest commit's result matters, on main as on a pull request.
  cancel-in-progress: true

jobs:
  # What a pull request changed, for this crate (.github/scripts/changes.py). `own`: the crate's
  # files or this workflow; the slow jobs (the iOS build, the shots lint) run on main nightly,
  # and on a pull request only then. `run`: anything the crate builds from (`own`, the toolchain, a
  # workspace crate it depends on by path, the root Cargo.toml past its members line, or a
  # Cargo.lock package in its dependency tree); the macOS job runs only then, so adding a crate to
  # the workspace or bumping another crate's dependency doesn't run every crate's macOS job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      own: ${{ steps.diff.outputs.own }}
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then printf 'own=true\nrun=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changes.py '^(gpui\-core/|gpui\-cli/|third_party/|\.github/workflows/gpui\-core\.yml)' gpui-core gpui-cli >> "$GITHUB_OUTPUT"

  macos:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.run == 'true'
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p gpui-core --check
      - run: cargo clippy -p gpui-core --locked --all-targets -- -D warnings
      - run: cargo clippy -p gpui-core --locked --all-targets --features shots -- -D warnings
      # Syntax highlighting, off by default: its grammars and their queries.
      - run: cargo clippy -p gpui-core --locked --all-targets --features highlight -- -D warnings
      - run: cargo test -p gpui-core --locked --features highlight --lib --test text_view_highlight
      - run: cargo test -p gpui-core --locked --features highlight --doc
      # Typeset math (KaTeX's layout, vendored katex-native), off by default.
      - run: cargo clippy -p gpui-core --locked --all-targets --features math -- -D warnings
      - run: cargo test -p gpui-core --locked --features math --lib
      # Unit, interaction and headless tests, and the README's examples compiled.
      - run: cargo test -p gpui-core --locked
      - run: cargo doc -p gpui-core --locked --no-deps --features highlight
        env:
          RUSTDOCFLAGS: -D warnings
      # Every crate draws with gpui-core, and their workflows don't run for a gpui-core change
      # alone: lint them all and build their tests here, in one job instead of one per crate.
      # Main's nightly run tests each crate in full.
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked --no-run

  ios:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.own == 'true'
    # The crate must build for iOS too (a host may run its components on iPhone and iPad).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-core-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-core --locked --target aarch64-apple-ios-sim
      # The grammars are C, built for the simulator too.
      - run: cargo build -p gpui-core --locked --target aarch64-apple-ios-sim --features highlight

  copies:
    # `gpui add`: its own tests, then every component copied into a new crate as a host
    # would and built, and one copy run next to gpui-core's original in one app, to show the
    # renamed actions and key contexts don't clash (gpui-cli/ci/check-copies.sh). On Linux,
    # where GPUI's core builds without a platform: the cheapest runner, and on every push too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-core-copies
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p gpui-cli --check
      - run: cargo clippy -p gpui-cli --locked --all-targets -- -D warnings
      - run: cargo test -p gpui-cli --locked
      # The scratch crate builds into the workspace's target, which the cache keeps.
      - run: gpui-cli/ci/check-copies.sh "$RUNNER_TEMP/copies"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

  wasm:
    # gpui-core must build for the browser too: the docs site's live demos run it as wasm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-core-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, which rustup installs here first.
      - run: rustup target add wasm32-unknown-unknown
      # Clippy, not just a check: lints that differ by target (pointer sizes) show up here.
      - run: cargo clippy -p gpui-core --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p gpui-core --locked --features math --target wasm32-unknown-unknown -- -D warnings
