name: gpui-agents

# Runs when gpui-agents, gpui-core (its presses), or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-agents/**"
      - "gpui-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-agents.yml"
  # A gpui-core change alone doesn't run the macOS job (changes.py's --not gpui-core):
  # gpui-core's own workflow lints every crate and builds its tests then, and main's nightly run
  # tests them all. Another crate this one depends on by path (gpui-dnd, say) does run it.
  pull_request:
    paths:
      - "gpui-agents/**"
      # The crates it depends on by path change it too (.github/scripts/changes.py decides).
      - "gpui-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-agents.yml"

  # Every change was built and tested on its pull request, so a push to main runs only the
  # Linux jobs: GitHub runs 5 macOS jobs at once, and each push to main queued macOS and iOS
  # jobs in every crate. Main gets the full macOS and iOS run once a night instead (which is
  # also when the caches pull requests restore are saved), or by hand.
  schedule:
    - cron: "27 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The changes job lists a pull request's files.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only the newest commit's result matters, on main as on a pull request.
  cancel-in-progress: true

jobs:
  # What a pull request changed, for this crate (.github/scripts/changes.py). `own`: the crate's
  # files or this workflow; the slow jobs (the iOS build, the shots lint) run on main nightly,
  # and on a pull request only then. `run`: anything the crate builds from (`own`, the toolchain, a
  # workspace crate it depends on by path, the root Cargo.toml past its members line, or a
  # Cargo.lock package in its dependency tree); the macOS job runs only then, so adding a crate to
  # the workspace or bumping another crate's dependency doesn't run every crate's macOS job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      own: ${{ steps.diff.outputs.own }}
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then printf 'own=true\nrun=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changes.py '^(gpui\-agents/|\.github/workflows/gpui\-agents\.yml)' gpui-agents --not gpui-core >> "$GITHUB_OUTPUT"

  macos:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.run == 'true'
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-agents
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p gpui-agents --check
      - run: cargo clippy -p gpui-agents --locked --all-targets -- -D warnings
      - if: needs.changes.outputs.own == 'true'
        run: cargo clippy -p gpui-agents --locked --all-targets --features shots -- -D warnings
      # Unit, interaction and headless tests, and the README's examples compiled.
      - run: cargo test -p gpui-agents --locked
      # The streaming performance bounds, as the README measures them.
      - run: cargo test -p gpui-agents --locked --release --test stream_performance
      - run: cargo doc -p gpui-agents --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    # Apps can draw the cards as wasm on GPUI's web platform, so gpui-agents must build for
    # the browser too.
    runs-on: ubuntu-latest
    # std's clock panics in a browser: clippy here refuses std::time's now and elapsed
    # (.github/clippy-wasm/clippy.toml), so the code reads web-time's clock instead.
    env:
      CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy-wasm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-agents-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, which rustup installs here first.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p gpui-agents --locked --target wasm32-unknown-unknown
      # --no-deps: gpui-agents's own code; its dependencies are linted by their own workflows.
      - run: cargo clippy -p gpui-agents --locked --lib --no-deps --target wasm32-unknown-unknown -- -D clippy::disallowed_methods

  ios:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.own == 'true'
    # The renderer on iOS, built for the simulator (Apple silicon) and the parser alone. An app
    # brings GPUI's iOS platform itself (gpui-pre-ios); the crate needs none. Tests run on macOS
    # with the touch settings forced (tests/touch.rs), not in a simulator.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-agents-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, which rustup installs here first.
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-agents --locked --target aarch64-apple-ios-sim
      - run: cargo build -p gpui-agents --locked --target aarch64-apple-ios-sim --no-default-features
      - run: cargo clippy -p gpui-agents --locked --target aarch64-apple-ios-sim --all-targets -- -D warnings

  parser:
    # The parser and model alone (default-features = false) must build and pass on Linux with no
    # GPUI in the build: apps test their non-UI crates there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-agents-parser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p gpui-agents --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test -p gpui-agents --locked --no-default-features
      # Nothing of GPUI, GPUI Kit or gpui-core may be in the parser-only build.
      - run: "! cargo tree -p gpui-agents --no-default-features -e normal --locked | grep -E 'gpui-(kit|pre|core)'"
