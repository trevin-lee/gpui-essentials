name: gpui-dnd

# Runs when gpui-dnd, gpui-core (whose theme it draws in), or something every crate shares, changes.
on:
  push:
    branches: [main]
    paths:
      - "gpui-dnd/**"
      - "gpui-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-dnd.yml"
  # A gpui-core change alone doesn't run the macOS job (changes.py's --not gpui-core):
  # gpui-core's own workflow lints every crate and builds its tests then, and main's nightly run
  # tests them all. Another crate this one depends on by path (gpui-dnd, say) does run it.
  pull_request:
    paths:
      - "gpui-dnd/**"
      # The crates it depends on by path change it too (.github/scripts/changes.py decides).
      - "gpui-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui-dnd.yml"

  # Every change was built and tested on its pull request, so a push to main runs only the
  # Linux jobs: GitHub runs 5 macOS jobs at once, and each push to main queued macOS and iOS
  # jobs in every crate. Main gets the full macOS and iOS run once a night instead (which is
  # also when the caches pull requests restore are saved), or by hand.
  schedule:
    - cron: "53 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The changes job lists a pull request's files.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only the newest commit's result matters, on main as on a pull request.
  cancel-in-progress: true

jobs:
  # What a pull request changed, for this crate (.github/scripts/changes.py). `own`: the crate's
  # files or this workflow; the slow job (the iOS build) runs on main nightly, and on a pull
  # request only then. `run`: anything the crate builds from (`own`, the toolchain, a workspace
  # crate it depends on by path, the root Cargo.toml past its members line, or a Cargo.lock package
  # in its dependency tree); the macOS job runs only then, so adding a crate to the workspace or
  # bumping another crate's dependency doesn't run every crate's macOS job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      own: ${{ steps.diff.outputs.own }}
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then printf 'own=true\nrun=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changes.py '^(gpui\-dnd/|\.github/workflows/gpui\-dnd\.yml)' gpui-dnd --not gpui-core >> "$GITHUB_OUTPUT"

  macos:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.run == 'true'
    # GPUI draws through Metal, so GitHub's macOS runners build and run its tests, the headless
    # ones included.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-dnd
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p gpui-dnd --check
      - run: cargo clippy -p gpui-dnd --locked --all-targets -- -D warnings
      - if: needs.changes.outputs.own == 'true'
        run: cargo clippy -p gpui-dnd --locked --all-targets --features shots -- -D warnings
      # The headless tests: simulated mouse, keys and touch, and the idle render counts.
      - run: cargo test -p gpui-dnd --locked
      - run: cargo doc -p gpui-dnd --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    # Apps run gpui-calendar (which drags with gpui-dnd) as wasm on GPUI's web platform, so
    # gpui-dnd must build for the browser too: caught here rather than in its dependents.
    runs-on: ubuntu-latest
    # std's clock panics in a browser: clippy here refuses std::time's now and elapsed
    # (.github/clippy-wasm/clippy.toml), so the code reads web-time's clock instead.
    env:
      CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy-wasm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-dnd-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, which rustup installs here first.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p gpui-dnd --locked --target wasm32-unknown-unknown
      # --no-deps: gpui-dnd's own lints; gpui-core's wasm build is linted by its own workflow.
      - run: cargo clippy -p gpui-dnd --locked --lib --no-deps --target wasm32-unknown-unknown -- -D warnings

  ios:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.own == 'true'
    # Hosts on iPhone and iPad draw with GPUI's iOS backend, so the crate must build for iOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Caches the registry and the build, keyed on Cargo.lock and the toolchain; only main
      # saves, so pull requests don't push main's caches out of the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-dnd-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo build -p gpui-dnd --locked --target aarch64-apple-ios-sim

  # Pictures of the examples for the README, rendered offscreen on macOS: run by hand
  # (`gh workflow run gpui-dnd.yml --ref <branch>`), they come back as an artifact to quantise
  # and commit in gpui-dnd/docs/.
  shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gpui-dnd-shots
          save-if: false
      - run: |
          mkdir -p shots
          for shot in "kanban drag" "sortable drag" "nested hover" "custom_preview drag"; do
            set -- $shot
            cargo run -p gpui-dnd --locked --features shots --example "$1" -- --shot "shots/$1-$2.png" --scene "$2"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-dnd-shots
          path: shots
