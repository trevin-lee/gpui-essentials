[package]
name = "gpui-chatwidgets"
version = "0.1.0"
description = "Draws AI agents' OpenUI cards (cards, tables, charts, forms, buttons) natively in GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "openui", "generative-ui", "chat", "gui"]
categories = ["gui", "parser-implementations"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_chatwidgets"

[dependencies]
# The parser and model (gpui_chatwidgets::openui), which build without GPUI.
regex = "1"
serde = { version = "1", features = ["derive"] }
# An object keeps the order its keys came in, as JavaScript's does: a press's message to the
# agent writes the card's values in that order, as OpenUI's web renderer does.
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
# The renderer (the gpui feature). Pinned exactly: GPUI comes as GPUI Kit, which pins a snapshot
# of Zed's GPUI (gpui-pre 0.3.12), and a host using this crate must link the same one.
gpui-kit = { workspace = true, optional = true }
# Everything pressable (buttons, tabs, chips, table cells) through its Press, the text fields,
# the slider and tooltips: gpui-core, on the same GPUI. GPUI Kit still draws the date picker
# and Markdown.
gpui-core = { path = "../gpui-core", optional = true }
# The date picker's dates; the version GPUI Kit's own date picker uses.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"], optional = true }
# Only for the shots feature: the same GPUI with its test support (offscreen rendering) on, and
# GPUI's version of the image crate to save the picture.
gpui-pre = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The shots feature's offscreen window is the Mac's. On iOS an app brings GPUI's platform itself
# (gpui-pre-ios), and GPUI Kit pulls in no platform there.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }

[features]
default = ["gpui"]
# The GPUI renderer. Without it (default-features = false) the crate is the parser and model
# alone, with no GPUI in the build.
gpui = ["dep:gpui-kit", "dep:gpui-core", "dep:chrono"]
# Pictures of the gallery example rendered offscreen (`--shots`).
shots = ["gpui", "dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "gallery"
required-features = ["gpui"]

# GPUI's test support (a test window, simulated input) is macOS-only here, so the parser-only
# build and its tests on Linux never pull GPUI in.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# The overflow test lays text out with Core Text, as on screen, and reads the drawn scene.
gpui-pre = { workspace = true, features = ["test-support", "bench-support"] }
gpui-pre-apple = { workspace = true, features = ["font-kit"] }
