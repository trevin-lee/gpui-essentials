name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GPUI draws through Metal; the macOS runners build and run the renderer's tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo build --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features shots -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      # The parser's goldens, the renderer's interaction, overflow and hostile-input tests, and
      # the README's example compiled (it's marked no_run).
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  parser:
    # The parser and model alone (default-features = false) build and pass on Linux with no
    # GPUI in the build, as a host's non-UI crate uses them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parser-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --lib --tests -- -D warnings
      - run: cargo test --locked --no-default-features
      # Nothing of GPUI may be in the parser's build.
      - run: "! cargo tree --locked --no-default-features --edges normal,dev | grep -E \"gpui-(pre|kit|base|component)\""
