# Changed in Trevin Lee's fork (2026): Rust 1.100, drawn with gpui-core instead of gpui-kit; brought
# into gpui-essentials as gpui-blocks' engine.
[package]
name = "gpui-blocks-engine"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "The block editor gpui-blocks is built on: a fork of gpui-kit-markdown-editor."
license.workspace = true
repository.workspace = true
readme = "README.md"
# gpui-blocks' internals, not an API of their own.
publish = false
keywords = ["gpui", "markdown", "editor", "wysiwyg"]
categories = ["gui", "text-editors"]
include = [
    "/src",
    "/tests/fixtures",
    "/docs/*.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
]

[lib]
name = "markdown_editor"
path = "src/lib.rs"
doctest = false

[dependencies]
# GPUI itself, under its own name, as gpui-core takes it.
gpui = { workspace = true }
# The theme, icons and paragraph layer the engine draws with (see docs/drawing.md).
gpui-core = { path = "../../gpui-core" }
# Block drags: gpui-dnd runs a drag's life (the pointer, the finger, Escape, the release, edge
# scrolling); the editor decides what's dragged and where it drops (see src/dnd.rs).
gpui-dnd = { path = "../../gpui-dnd" }
markdown = "1.0.0"
unicode-segmentation = "1.12.0"

# The clock in a browser, which has no std Instant (see src/clock.rs).
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
anyhow = "1"
gpui = { workspace = true, features = ["test-support"] }
