# Changed in Trevin Lee's fork (2026): gpui-kit 0.9.1, Rust 1.100; brought into gpui-essentials as
# gpui-blocks' engine.
[package]
name = "gpui-blocks-engine"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "The block editor gpui-blocks is built on: a fork of gpui-kit-markdown-editor."
license.workspace = true
repository.workspace = true
readme = "README.md"
# gpui-blocks' internals, not an API of their own.
publish = false
keywords = ["gpui", "markdown", "editor", "wysiwyg"]
categories = ["gui", "text-editors"]
include = [
    "/src",
    "/assets/icons",
    "/examples",
    "/tests/fixtures",
    "/docs/*.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
]

[lib]
name = "markdown_editor"
path = "src/lib.rs"
doctest = false

[features]
default = ["syntect"]
# Syntax highlighting for fenced code blocks (the editor renders through
# gpui-kit's text renderer, which highlights only when it's on): syntect, about
# 200 languages. The fork dropped upstream's tree-sitter option when it came into
# gpui-essentials, which nothing used, so the workspace's lockfile stays lean.
syntect = ["gpui-kit/syntect"]

[dependencies]
# The paragraph layer the engine draws its own blocks with (see docs/drawing.md).
gpui-core = { path = "../../gpui-core" }
gpui-kit = { workspace = true }
markdown = "1.0.0"
unicode-segmentation = "1.12.0"

[dev-dependencies]
anyhow = "1"
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "story"
path = "examples/story.rs"
# The story has its own UI tests (link bar, toolbar commands).
test = true
