name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GPUI draws through Metal; the macOS runners build and run its tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --lib
      - run: cargo build --example editor
