[package]
name = "gpui-blocks"
version = "0.1.0"
description = "A block editor for GPUI Kit apps: Markdown documents with a slash menu, drag handles, callouts, toggles and widget blocks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "editor", "markdown", "block-editor", "wysiwyg"]
categories = ["gui", "text-editors"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_blocks"

[dependencies]
gpui-kit = { workspace = true }
# The document model, input, selection, undo and drawing: gpui-kit-markdown-editor, through a fork
# that adds callouts, toggles, block motion and the hooks this crate draws its menus with. Pinned
# to a commit until those changes are published.
markdown_editor = { package = "gpui-kit-markdown-editor", git = "https://github.com/trevin-lee/gpui-kit-markdown-editor", rev = "0ce34f876112b5d5ac03a3e0c46e60a5f1f8af6c" }
# The parser's syntax tree, for widget blocks: the version gpui-kit parses with.
markdown = "1.0.0"
# Only for the shots feature, which only the example uses: GPUI with its test support (offscreen rendering) on, and GPUI's
# version of the image crate to save the picture.
gpui-pre = { workspace = true, features = ["test-support"], optional = true }
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Pictures of the example's window rendered offscreen (`--shot`).
shots = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "editor"

[dev-dependencies]
futures = "0.3"
gpui-kit = { workspace = true, features = ["test-support"] }
