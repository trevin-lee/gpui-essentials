[package]
name = "gpui-blocks"
version = "0.1.0"
description = "A block editor for GPUI apps: Markdown documents with a slash menu, drag handles, callouts, toggles and widget blocks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "editor", "markdown", "block-editor", "wysiwyg"]
categories = ["gui", "text-editors"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_blocks"

[dependencies]
# GPUI itself, under its own name, and the theme, components and icons the editor draws with.
gpui = { workspace = true }
gpui-core = { path = "../gpui-core" }
# The document model, input, selection, undo and drawing: the engine, a fork of
# gpui-kit-markdown-editor in engine/, with callouts, toggles, block motion and the hooks this
# crate draws its menus with.
markdown_editor = { package = "gpui-blocks-engine", path = "engine" }
# The parser's syntax tree, for widget blocks: the version the engine parses with.
markdown = "1.0.0"
# The JSON form of a document (`json`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the shots feature, which only the example uses: GPUI with its test support (offscreen rendering) on, and GPUI's
# version of the image crate to save the picture.
gpui-pre = { workspace = true, features = ["test-support"], optional = true }
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Pictures of the example's window rendered offscreen (`--shot`).
shots = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "editor"

[dev-dependencies]
# The keyboard drag's announcements, read in the tests.
gpui-dnd = { path = "../gpui-dnd" }
futures = "0.3"
gpui = { workspace = true, features = ["test-support"] }
# The example's platform, as gpui-core's gallery opens it.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
