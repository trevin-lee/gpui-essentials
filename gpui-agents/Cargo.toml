[package]
name = "gpui-agents"
version = "0.1.0"
description = "Draws AI agents' OpenUI cards (cards, tables, charts, forms, buttons) natively in GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "openui", "generative-ui", "chat", "gui"]
categories = ["gui", "parser-implementations"]
include = ["/src", "/examples", "/README.md"]

[lib]
name = "gpui_agents"

[dependencies]
# The parser and model (gpui_agents::openui), which build without GPUI.
regex = "1"
serde = { version = "1", features = ["derive"] }
# An object keeps the order its keys came in, as JavaScript's does: a press's message to the
# agent writes the card's values in that order, as OpenUI's web renderer does.
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
# The renderer (the gpui feature): GPUI under its own name, pinned exactly in the workspace
# (gpui-pre 0.3.12), and a host using this crate must link the same one.
gpui = { workspace = true, optional = true }
# Everything pressable (buttons, tabs, chips, table cells) through its Press, the text fields,
# the slider, the date picker, tooltips and Markdown: gpui-core, on the same GPUI.
gpui-core = { path = "../gpui-core", optional = true }
# The date picker's dates; the version gpui-core's date picker uses.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"], optional = true }
# Only for the shots feature: GPUI's version of the image crate to save the picture.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The shots feature's offscreen window is the Mac's (its platform with test support on). On iOS
# an app brings GPUI's platform itself (gpui-pre-ios), and the crate pulls in none there.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { workspace = true, features = ["test-support"], optional = true }

[features]
default = ["gpui"]
# The GPUI renderer. Without it (default-features = false) the crate is the parser and model
# alone, with no GPUI in the build.
gpui = ["dep:gpui", "dep:gpui-core", "dep:chrono"]
# Pictures of the gallery and stream examples rendered offscreen (`--shots`).
shots = ["gpui", "gpui/test-support", "dep:gpui-pre-macos", "dep:image"]

[[example]]
name = "gallery"
required-features = ["gpui"]

[[example]]
name = "stream"
required-features = ["gpui"]

[[example]]
name = "math"
required-features = ["gpui"]

# GPUI's test support (a test window, simulated input) and the gallery's window are the Mac's,
# so the parser-only build and its tests on Linux never pull GPUI in.
[target.'cfg(target_os = "macos")'.dev-dependencies]
# bench-support: the overflow test reads the drawn scene.
gpui = { workspace = true, features = ["test-support", "bench-support"] }
# The gallery's window: GPUI's platform for this OS. Without font-kit, macOS draws no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# Shaders compiled when a window opens, so tests and the gallery build without Xcode's separate
# Metal Toolchain. Only here: what apps ship stays on precompiled shaders.
gpui-pre-macos = { workspace = true, features = ["runtime_shaders"] }
# The overflow test lays text out with Core Text, as on screen.
gpui-pre-apple = { workspace = true, features = ["font-kit", "runtime_shaders"] }
